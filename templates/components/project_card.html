<article class="overflow-hidden rounded-2xl border border-slate-200 bg-white p-6 transition hover:-translate-y-1 dark:border-slate-800 dark:bg-slate-900"><h3 class="font-display text-xl font-bold">{{ project.title }}</h3><p class="mt-3 text-slate-600 dark:text-slate-300">{{ project.summary }}</p><div class="mt-4 flex flex-wrap gap-2">{% for tag in project.tags %}<span class="text-xs text-indigo-600 dark:text-indigo-400">#{{ tag }}</span>{% endfor %}</div><div class="mt-5 flex gap-4 text-sm font-semibold">{% if project.live_url %}<a href="{{ project.live_url }}" target="_blank" rel="noreferrer">Live ↗</a>{% endif %}{% if project.source_url %}<a href="{{ project.source_url }}" target="_blank" rel="noreferrer">Code ↗</a>{% endif %}</div></article>
