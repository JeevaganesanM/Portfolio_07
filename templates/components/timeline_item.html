<article class="border-l-2 border-indigo-500 pl-5"><p class="text-sm text-indigo-600">{{ item.start_date|date:'Y' }}{% if item.end_date %} – {{ item.end_date|date:'Y' }}{% else %} – Present{% endif %}</p><h3 class="font-bold">{{ item.role }}</h3><p class="text-sm text-slate-500">{{ item.company }}</p><p class="mt-2 text-slate-600 dark:text-slate-300">{{ item.description }}</p></article>
