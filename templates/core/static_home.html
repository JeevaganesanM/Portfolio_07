{% extends 'portfolio_base.html' %}{% load static %}{% block content %}<section class="hero"><div><p class="eyebrow">{{ profile.location }}</p><h1>{{ profile.headline }}</h1><p>{{ profile.intro }}</p><p><a class="button" href="{% static profile.resume %}" download>Download resume</a><a class="button secondary" href="{% url 'core:contact' %}">Contact me</a></p></div><img class="portrait" src="{% static profile.photo %}" alt="Portrait of {{ profile.name }}"></section><section><h2>Education & achievements</h2><div class="stats">{% for item in achievements %}<article><strong>{{ item.value }}</strong><span>{{ item.label }}</span></article>{% endfor %}</div></section>{% endblock %}
