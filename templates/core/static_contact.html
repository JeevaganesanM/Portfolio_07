{% extends 'portfolio_base.html' %}
{% block title %}Let's connect | {{ profile.name }}{% endblock %}
{% block content %}
<section class="page contact-page">
  <p class="eyebrow">Get in touch</p>
  <h1>Let's connect</h1>
  <p>{{ profile.intro }}</p>
  <p class="contact-location">{{ profile.location }}</p>

  <div class="contact-links">
    <a class="contact-link-card" href="mailto:{{ profile.email }}">
      <span class="contact-link-label">Email</span>
      <span class="contact-link-value">{{ profile.email }}</span>
    </a>
    <a class="contact-link-card" href="{{ profile.github }}" target="_blank" rel="noopener noreferrer">
      <span class="contact-link-label">GitHub</span>
      <span class="contact-link-value">{{ profile.github }}</span>
    </a>
    <a class="contact-link-card" href="{{ profile.linkedin }}" target="_blank" rel="noopener noreferrer">
      <span class="contact-link-label">LinkedIn</span>
      <span class="contact-link-value">{{ profile.linkedin }}</span>
    </a>
  </div>
</section>
{% endblock %}
